name: PaymentShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-connector.txt
      - name: Compile Python files
        run: python -m py_compile app.py scripts/train_models.py src/fraudshield/*.py tests/test_risk_engine.py
      - name: Run tests
        run: python -m pytest -q
      - name: Train models and audit data
        run: python scripts/train_models.py
      - name: Train checkout models and evaluate locked policy
        run: python scripts/train_checkout.py
      - name: Keep checkout evaluation and predictions
        uses: actions/upload-artifact@v4
        with:
          name: checkout-evaluation
          path: |
            artifacts/checkout/evaluation.json
            artifacts/checkout/evaluation.png
            artifacts/checkout/test_predictions.csv
      - name: Keep evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: paymentshield-evaluation
          path: artifacts/metrics.json
      - name: Install browser for visual checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check the real browser and capture previews
        run: python scripts/capture_demo.py
      - name: Exercise checkout and merchant review in a browser
        run: python scripts/capture_connector.py
      - name: Keep checkout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-previews
          path: artifacts/checkout/previews/*.png
      - name: Keep visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paymentshield-previews
          path: artifacts/previews/
